name: Build T-Dongle-S3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-esp32s3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt install -y git wget flex bison gperf python3 \
            python3-pip python3-venv cmake ninja-build ccache \
            libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Install ESP-IDF
        run: |
          git clone --recursive \
            https://github.com/espressif/esp-idf.git
          cd esp-idf
          git checkout tags/v5.5
          ./install.sh esp32s3
          cd ..

      - name: Build ESP32-S3
        run: |
          cd esp-idf && . ./export.sh && cd ..
          idf.py set-target esp32s3
          idf.py all
          mkdir -p release
          cd build
          esptool.py --chip ESP32-S3 merge_bin \
            -o ../release/pico_fido_esp32-s3.bin @flash_args
          cd ..

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: pico_fido_tdongle_s3
          path: release/pico_fido_esp32-s3.bin
          retention-days: 30
